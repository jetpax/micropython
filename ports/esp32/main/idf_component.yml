dependencies:
  espressif/mdns: "~1.1.0"
  espressif/tinyusb:
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
    # Temporary workaround for https://github.com/hathach/tinyusb/issues/3154
    # Can be removed once fix is released in espressif/tinyusb
    git: https://github.com/micropython/tinyusb-espressif.git
    version: cherrypick/dwc2_zlp_fix
  espressif/esp_hosted:
    rules:
      - if: "target == esp32p4"
    version: "2.7.0"
  espressif/esp_wifi_remote:
    rules:
      - if: "target == esp32p4"
    version: "0.15.2"
  espressif/lan867x:
    version: "~1.0.0"
    rules:
      - if: "target == esp32"
  # Required for pyDirect httpserver (modwebfiles.c uses esp_vfs_littlefs)
  joltwallet/littlefs: "^1.0.0"
  # Required for pyDirect husarnet VPN module
  husarnet/esp_husarnet: "^0.0.15"
  # Required for pyDirect modwebrepl.c (CBOR encoding)
  espressif/cbor: "^0.6.0"
  # Required for pyDirect modwebrtc.c (WebRTC)
  espressif/esp_peer: "^1.2.2"
  # Required for pyDirect usbmodem (USB 4G modem)
  espressif/iot_usbh_modem:
    version: "^2.0.0"
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
  idf:
    version: ">=5.3.0"
