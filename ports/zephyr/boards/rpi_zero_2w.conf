# Pi Zero 2 W board overrides for MicroPython on Zephyr.
#
# Disable subsystems that the upstream MP prj.conf enables but
# this board doesn't have working drivers for yet. As those land
# (Wi-Fi via CYW43439, watchdog), drop the corresponding lines.

# Networking: enabled now that the brcmfmac Zephyr driver is being
# stood up (drivers/wifi/brcmfmac/).
CONFIG_NETWORKING=y
# DHCPv4 client so the iface gets an IP automatically after WLC_E_LINK
# brings net_if_dormant_off; CONFIG_NET_DHCPV4_RESTART_ON_IF_UP is on by
# default but the driver also calls net_dhcpv4_restart() explicitly.
CONFIG_NET_DHCPV4=y

# Disable Zephyr's boot-time NET_CONFIG helper entirely. With wifi-driven
# net init (DHCP via brcmfmac WLC_E_LINK), the helper is worse than useless:
# it registers a stack-local net_mgmt callback at boot, times out waiting
# for the iface (wifi isn't up until ~9 s after boot), returns -- and
# leaves the dead callback in net_mgmt's global list. When DHCP later
# completes via our path, net_mgmt fires the stale handler -> instruction
# abort on freed stack memory. CONFIG_NET_CONFIG_SETTINGS=n removes the
# subsystem; CONFIG_NET_CONFIG_NEED_IPV4=n is then a no-op but kept
# explicit for clarity.
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_CONFIG_NEED_IPV4=n

# Phase 4.5b diagnostics: surface DHCP at DBG (DISCOVER/OFFER/REQUEST/
# ACK only log at DBG in dhcpv4.c), net_if/IPv4 at INF. Drop back to
# default once Phase 4.5 is closed.
# CONFIG_NET_LOG is the master switch -- per-module level Kconfigs are
# silently no-op'd unless this is on (module-dep = NET_LOG).
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_LOG_LEVEL_DBG=y
CONFIG_NET_IF_LOG_LEVEL_INF=y
CONFIG_NET_IPV4_LOG_LEVEL_INF=y

# No watchdog node in dts/arm64/broadcom/bcm2710.dtsi -- machine_wdt.c
# would otherwise fail to resolve DT_ALIAS(watchdog0).
CONFIG_WATCHDOG=n

# The SoC has a real brcm,iproc-rng200 instance; don't pull in the
# soft test RNG.
CONFIG_TEST_RANDOM_GENERATOR=n

# MicroPython's mp_active_ctx is __thread-qualified; without TLS
# support the access through TPIDR_EL0 + offset faults at boot
# (data abort accessing 0x10). The cross-compile toolchain variant
# doesn't auto-advertise TLS support, so we force it on -- the
# zephyr-sdk aarch64-zephyr-elf gcc supports __thread fine.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# SDHC subsystem: needed by the BCM2835 SDHCI host driver
# (drivers/sdhc/sdhc_bcm2835.c) which targets the EMMC port wired
# to the CYW43439 wireless module.
CONFIG_SDHC=y
CONFIG_SDHC_LOG_LEVEL_INF=y

# Logging subsystem. Required for the SDHC driver's LOG_INF/LOG_ERR
# diagnostics to appear on the console -- without CONFIG_LOG=y the
# macros expand to nothing. IMMEDIATE mode flushes synchronously so
# driver init messages aren't dropped or reordered around the
# MicroPython REPL banner.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# BCM43430A1 / CYW43439 Wi-Fi driver (drivers/wifi/brcmfmac/). Auto-
# selects SDIO_STACK, NET_L2_ETHERNET, NET_L2_WIFI_MGMT etc.
CONFIG_WIFI=y
CONFIG_WIFI_BRCMFMAC=y
CONFIG_SD_LOG_LEVEL_INF=y

# GPIO subsystem: required by the SDHC driver's wifi-reg-on-gpios
# property (drives the CYW43439's WL_REG_ON line) and by `machine.Pin()`
# from the MicroPython REPL. The bcm2711-gpio driver covers the BCM2710
# legacy pull-control sequence too (legacy-pull-control DT prop).
CONFIG_GPIO=y

# 64 MiB MP heap. The default upstream value is 48 KiB which makes
# sense on a 4 MiB STM32 but is laughable on a 512 MiB Pi Zero 2 W.
# 64 MiB leaves the rest of the 256 MiB sram0 mapping for kernel
# state, thread stacks, and future drivers (notably the eventual
# CYW43439 + SDIO buffers). Tune down if the heap-init cost or
# longer GC sweeps become noticeable.
CONFIG_MICROPY_HEAP_SIZE=67108864
