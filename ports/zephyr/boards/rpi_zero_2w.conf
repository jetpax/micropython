# Pi Zero 2 W board overrides for MicroPython on Zephyr.
#
# Disable subsystems that the upstream MP prj.conf enables but
# this board doesn't have working drivers for yet. As those land
# (Wi-Fi via CYW43439, watchdog), drop the corresponding lines.

# Networking: enabled now that the brcmfmac Zephyr driver is being
# stood up (drivers/wifi/brcmfmac/).
CONFIG_NETWORKING=y
# DHCPv4 client so the iface gets an IP automatically after WLC_E_LINK
# brings net_if_dormant_off; CONFIG_NET_DHCPV4_RESTART_ON_IF_UP is on by
# default but the driver also calls net_dhcpv4_restart() explicitly.
CONFIG_NET_DHCPV4=y

# Hostname: enable + make it runtime-settable so network.hostname(...)
# from MP propagates into DHCP DISCOVER as Option 12. Default matches
# MICROPY_PY_NETWORK_HOSTNAME_DEFAULT in ports/zephyr/mpconfigport.h
# so the boot-time DHCP request advertises the same name MP reports
# from network.hostname() before the user overrides it.
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="mpy-zephyr"

# Empty the test-net placeholder DNS from the MP port's prj.conf
# (CONFIG_DNS_SERVER1="192.0.2.2"). With it set, the resolver context
# pre-populates with the bogus address and first_ipv4_dns() in
# modnetwork_wlan.c returns it ahead of the DHCP-provided server.
# Empty -> DHCPv4 option 6 (via NET_DHCPV4_OPTION_DNS_ADDRESS, default
# y) is the only source, and ifconfig() shows the real gateway.
CONFIG_DNS_SERVER1=""

# Disable Zephyr's boot-time NET_CONFIG helper entirely. With wifi-driven
# net init (DHCP via brcmfmac WLC_E_LINK), the helper is worse than useless:
# it registers a stack-local net_mgmt callback at boot, times out waiting
# for the iface (wifi isn't up until ~9 s after boot), returns -- and
# leaves the dead callback in net_mgmt's global list. When DHCP later
# completes via our path, net_mgmt fires the stale handler -> instruction
# abort on freed stack memory. CONFIG_NET_CONFIG_SETTINGS=n removes the
# subsystem; CONFIG_NET_CONFIG_NEED_IPV4=n is then a no-op but kept
# explicit for clarity.
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_CONFIG_NEED_IPV4=n

# No watchdog node in dts/arm64/broadcom/bcm2710.dtsi -- machine_wdt.c
# would otherwise fail to resolve DT_ALIAS(watchdog0).
CONFIG_WATCHDOG=n

# The SoC has a real brcm,iproc-rng200 instance; don't pull in the
# soft test RNG.
CONFIG_TEST_RANDOM_GENERATOR=n

# MicroPython's mp_active_ctx is __thread-qualified; without TLS
# support the access through TPIDR_EL0 + offset faults at boot
# (data abort accessing 0x10). The cross-compile toolchain variant
# doesn't auto-advertise TLS support, so we force it on -- the
# zephyr-sdk aarch64-zephyr-elf gcc supports __thread fine.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# SDHC subsystem: needed by the BCM2835 SDHCI host driver
# (drivers/sdhc/sdhc_bcm2835.c) which targets the EMMC port wired
# to the CYW43439 wireless module.
CONFIG_SDHC=y
CONFIG_SDHC_LOG_LEVEL_INF=y

# Logging subsystem. Required for the SDHC driver's LOG_INF/LOG_ERR
# diagnostics to appear on the console -- without CONFIG_LOG=y the
# macros expand to nothing. IMMEDIATE mode flushes synchronously so
# driver init messages aren't dropped or reordered around the
# MicroPython REPL banner.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# BCM43430A1 / CYW43439 Wi-Fi driver (drivers/wifi/brcmfmac/). Auto-
# selects SDIO_STACK, NET_L2_ETHERNET, NET_L2_WIFI_MGMT etc.
CONFIG_WIFI=y
CONFIG_WIFI_BRCMFMAC=y
CONFIG_SD_LOG_LEVEL_INF=y

# GPIO subsystem: required by the SDHC driver's wifi-reg-on-gpios
# property (drives the CYW43439's WL_REG_ON line) and by `machine.Pin()`
# from the MicroPython REPL. The bcm2711-gpio driver covers the BCM2710
# legacy pull-control sequence too (legacy-pull-control DT prop).
CONFIG_GPIO=y

# SPI subsystem: enables the BCM2835 SPI0 controller driver
# (drivers/spi/spi_bcm2835.c) and `machine.SPI()` from the REPL.
CONFIG_SPI=y

# I2S subsystem: enables the BCM2835 PCM/I2S controller driver
# (drivers/i2s/i2s_bcm2835.c) and `machine.I2S()` from the REPL. The
# driver selects DMA, pulling in drivers/dma/dma_bcm2835.c for the
# sample-buffer stream. The i2s + dma nodes are enabled by the board
# overlay (boards/rpi_zero_2w.overlay).
CONFIG_I2S=y

# 64 MiB MP heap. The default upstream value is 48 KiB which makes
# sense on a 4 MiB STM32 but is laughable on a 512 MiB Pi Zero 2 W.
# 64 MiB leaves the rest of the 256 MiB sram0 mapping for kernel
# state, thread stacks, and future drivers (notably the eventual
# CYW43439 + SDIO buffers). Tune down if the heap-init cost or
# longer GC sweeps become noticeable.
CONFIG_MICROPY_HEAP_SIZE=67108864

# C++ language support. Needed by the lgfx display module (LovyanGFX is
# C++17). No MicroPython port had ever enabled C++ before -- lgfx Phase A
# Step 1 (the cxxprobe user module in pyDirect/ports/zephyr/) proves the
# cross-compile toolchain + USER_C_MODULES + STATIC-lib link path.
#
# GNU libstdc++, not Zephyr's minimal C++ library: minimal libcpp ships
# only <cstddef>/<cstdint>/<new> and lacks std::nothrow + __cxa_guard_*,
# so it cannot build LovyanGFX (which needs <type_traits>, <algorithm>,
# etc.). The aarch64-zephyr-elf toolchain ships libstdc++, but the
# `cross-compile` toolchain variant never sets TOOLCHAIN_HAS_GLIBCXX -- so
# the build must also pass -DTOOLCHAIN_HAS_GLIBCXX=ON for Kconfig to allow
# GLIBCXX_LIBCPP (same pattern as the forced TLS support above). Selecting
# GLIBCXX_LIBCPP directly -- not CONFIG_REQUIRES_FULL_LIBCPP -- keeps
# picolibc (REQUIRES_FULL_LIBCPP would select REQUIRES_FULL_LIBC).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

# Storage stack: RAM-backed disk_access disk + MicroPython VfsLfs2,
# mounted from _boot.py at /ram. This is the development scaffold until
# sdhc_bcm2835_sdhost.c lands; the long-term plan is to live-mount the
# microSD card at /sd for PFC agent-state persistence. See
# notes/zephyr_storage.html for the reasoning trail. The 16 MiB
# ramdisk is declared in the MP-port overlay (boards/rpi_zero_2w.overlay).
#
# Note: deliberately NOT enabling CONFIG_FILE_SYSTEM /
# CONFIG_FILE_SYSTEM_LITTLEFS. MP's VfsLfs2 binding uses its own
# littlefs (micropython/lib/littlefs/lfs2.c) and wraps the DiskAccess
# object directly. Enabling Zephyr's FS subsystem would also build
# zephyr_filesystem.c which expects a zephyr,fstab DT node -- something
# we have no reason to define here.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y
CONFIG_MICROPY_VFS_LFS2=y

# Disable frozen modules during dev. Kconfig auto-enables this when
# DISK_ACCESS or FLASH_MAP is set, which pulls in the mpy-cross host
# tool; that build step keeps tripping the cross-compile env (the
# parent west invocation exports CROSS_COMPILE, which leaks into the
# `make -C mpy-cross` sub-make and produces an aarch64 binary that
# can't run on the Mac). Drop the few KB of bytecode savings here in
# exchange for build reliability. The cost is that _boot.py doesn't
# get baked in, so the ramdisk has to be mounted by hand at the REPL
# after boot -- see notes/zephyr_storage.html §8a for the snippet.
CONFIG_MICROPY_FROZEN_MODULES=n

# Display subsystem -- first time enabled on this board. Drives the
# Pirate Audio ST7789 panel via display_st7789v over zephyr,mipi-dbi-spi
# (the panel is declared in the application overlay, not the board DTS).
# CONFIG_LVGL is left unset on purpose: lv_binding_micropython vendors
# its own LVGL, and enabling Zephyr's LVGL module would compile LVGL
# twice and produce a symbol clash.
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ST7789V=y
# Surface display + MIPI-DBI init errors during board bring-up; without
# these, panel-init failures (SPI errors, missing pins, etc.) are filtered
# at the LOG level and never reach the console.
CONFIG_DISPLAY_LOG_LEVEL_INF=y
CONFIG_MIPI_DBI_LOG_LEVEL_INF=y
