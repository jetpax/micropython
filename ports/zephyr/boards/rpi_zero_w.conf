# Original Pi Zero W (BCM2835, ARM1176JZF-S, ARMv6) board overrides for
# MicroPython on Zephyr.
#
# First-light scope: the REPL on USB CDC ACM, nothing else. The Zero 2 W
# config is a superset built around a Pirate Audio HAT (I2S DAC, ST7789
# panel, C++/LovyanGFX) plus CYW43439 Wi-Fi; none of that applies here.
# Storage, Wi-Fi and the display are deliberately left out until the
# REPL is proven on this core.

# Subsystems the upstream MP prj.conf enables that this board has no
# driver for yet.
CONFIG_WATCHDOG=n
CONFIG_TEST_RANDOM_GENERATOR=n

# MicroPython's mp_active_ctx is __thread-qualified, so TLS is not
# optional -- without it every MP_STATE_VM access faults. ARMv6 does
# advertise TLS support (arch/Kconfig selects
# ARCH_HAS_THREAD_LOCAL_STORAGE for CPU_AARCH32_ARMV6), but the
# cross-compile toolchain variant never sets the toolchain half, so
# force it exactly as the Zero 2 W does.
CONFIG_TOOLCHAIN_CROSS_COMPILE_SUPPORTS_THREAD_LOCAL_STORAGE=y
CONFIG_THREAD_LOCAL_STORAGE=y

# VC firmware (mailbox + property tags): the DWC2 vendor pre_enable hook
# calls SET_POWER_STATE(USB_HCD, on) to power the analog PHY island.
# Without it the DWC2 registers are readable but D+/D- are never driven.
# HWINFO rides the same driver for the board serial.
CONFIG_RASPBERRYPI_FIRMWARE=y
CONFIG_HWINFO=y

# USB device stack -- MP REPL over USB CDC ACM on the micro-USB OTG port.
# Do NOT set CDC_ACM_SERIAL_INITIALIZE_AT_BOOT: the port's own
# mp_usbd_init() registers the class itself and the auto-init races it.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_USBD_CDC_ACM_CLASS=y

# Route MP stdio through the tty/console subsystem so both RX and TX
# follow the chosen `zephyr,uart-mp-repl` (CDC ACM). The default
# zephyr_getchar path would read from `zephyr,console` (the mini-UART)
# while writing to CDC -- nothing typed would reach the REPL.
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_CONSOLE_GETCHAR_BUFSIZE=4096
CONFIG_CONSOLE_PUTCHAR_BUFSIZE=2048
CONFIG_CONSOLE_HANDLER=n

# Boot logs + driver diagnostics stay on the mini-UART so the REPL
# channel is clean.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# 8 MiB MP heap. Do not raise casually: objcopy -O binary zero-fills the
# heap's address range into the flat image when a loadable section sits
# above the noinit heap, which is how the Zero 2 W once produced an
# ~88 MB zephyr.bin.
CONFIG_MICROPY_HEAP_SIZE=8388608

# REPL C stack: the compiler and VM all run on the main thread. The
# port default (4736) is sized for far smaller targets.
CONFIG_MAIN_STACK_SIZE=32768

# microSD via the legacy SDHost controller (the overlay enables &sdhost
# and names its ALT0 mux). subsys/sd does full card init and exposes the
# slot as a disk_access disk named "SD"; the stock modules/_boot.py then
# mounts it at /sd, and prj.conf already carries MICROPY_VFS_FAT so the
# card's FAT32 boot partition is readable as-is.
CONFIG_DISK_ACCESS=y
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SD_LOG_LEVEL_INF=y

# --- Wi-Fi: on-module BCM43430A1 over the Arasan SDHCI (SDIO) ---
# All the devicetree work is already in the board DTS: &emmc enabled with
# the emmc_gpio34 mux, a brcmfmac child carrying wifi-reg-on-gpios, and
# &gpio1 widened to reach WL_REG_ON on BCM 41. So this is Kconfig only.
#
# The 43430A1 image is a Cypress trim-on-build build: without the CLM
# blob the radio stays COUNTRY_DISABLEd (null country "#n") and every
# radio operation fails BCME_NOTUP even though WLC_UP reports OK.
CONFIG_WIFI=y
CONFIG_WIFI_BRCMFMAC=y
CONFIG_WIFI_BRCMFMAC_FIRMWARE_FILE="brcmfmac43430-sdio.bin"
CONFIG_WIFI_BRCMFMAC_NVRAM_FILE="brcmfmac43430-sdio.txt"
CONFIG_WIFI_BRCMFMAC_CLM_FILE="brcmfmac43430-sdio.clm_blob"
CONFIG_WIFI_BRCMFMAC_COUNTRY="GB"
CONFIG_WIFI_LOG_LEVEL_WRN=y

# DHCPv4 so the interface gets an address once brcmfmac reports link up.
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET_MGMT=y

# Hostname, runtime-settable so network.hostname(...) from MicroPython
# reaches the DHCP DISCOVER as option 12.
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="mpy-zephyr"

# The port's prj.conf ships a test-net placeholder DNS
# (CONFIG_DNS_SERVER1="192.0.2.2"). Left set, the resolver pre-populates
# with that bogus address and returns it ahead of the DHCP-provided
# server. Empty means DHCPv4 option 6 is the only source.
CONFIG_DNS_SERVER1=""

# Disable Zephyr's boot-time NET_CONFIG helper. With Wi-Fi-driven net
# init it is worse than useless: it registers a stack-local net_mgmt
# callback at boot, times out waiting for an interface that Wi-Fi has
# not brought up yet, returns -- and leaves the dead callback in
# net_mgmt's global list. When DHCP later completes, net_mgmt fires the
# stale handler against freed stack memory.
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_NEED_IPV6=n

# Net stack sizes proven on this SoC by the Arduino Zero W loader.
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
